<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CSS MPT Practice Assessment - 150 Mixed MCQs</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --header-bg: rgba(255, 255, 255, 0.92);
      --badge-bg: #eef2ff;
      --badge-text: #4f46e5;
      --opt-bg: #ffffff;
      --opt-hover: #f1f5f9;
      --correct-bg: #f0fdf4;
      --correct-border: #22c55e;
      --correct-text: #14532d;
      --wrong-bg: #fef2f2;
      --wrong-border: #ef4444;
      --wrong-text: #7f1d1d;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] {
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --bg: #090d16;
      --card-bg: #131b2e;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --header-bg: rgba(19, 27, 46, 0.92);
      --badge-bg: #1e1b4b;
      --badge-text: #c7d2fe;
      --opt-bg: #182238;
      --opt-hover: #22304d;
      --correct-bg: #052e16;
      --correct-border: #16a34a;
      --correct-text: #86efac;
      --wrong-bg: #450a0a;
      --wrong-border: #dc2626;
      --wrong-text: #fca5a5;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 50px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 100;
      padding: 12px 16px;
      transition: background 0.3s, border-color 0.3s;
    }

    .header-content {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .title-group h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .title-group p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-btn {
      background: var(--opt-bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .theme-toggle-btn:active {
      transform: scale(0.9);
    }

    .stats-badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 6px 14px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    .container {
      max-width: 860px;
      margin: 16px auto;
      padding: 0 14px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1.5px solid var(--border);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      transition: transform 0.2s, border-color 0.2s, background-color 0.2s;
    }

    @media (min-width: 640px) {
      .card {
        padding: 22px;
        margin-bottom: 18px;
      }
      .title-group h1 {
        font-size: 1.2rem;
      }
      .title-group p {
        font-size: 0.85rem;
      }
    }

    .card.answered-correct {
      border-color: var(--correct-border);
      background: var(--correct-bg);
    }

    .card.answered-wrong {
      border-color: var(--wrong-border);
      background: var(--wrong-bg);
    }

    .q-title {
      font-weight: 600;
      font-size: 0.98rem;
      margin-bottom: 14px;
      color: var(--text);
    }

    .q-num {
      display: inline-block;
      font-weight: 800;
      color: var(--primary);
      margin-right: 6px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 680px) {
      .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
    }

    .opt-label {
      display: flex;
      align-items: center;
      padding: 14px 14px;
      min-height: 48px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      background: var(--opt-bg);
      color: var(--text);
      font-size: 0.92rem;
      line-height: 1.4;
      transition: all 0.2s;
      user-select: none;
      word-break: break-word;
    }

    .opt-label:not(.disabled):hover {
      background: var(--opt-hover);
      border-color: var(--primary);
    }

    .opt-label input[type="radio"] {
      margin-right: 12px;
      width: 20px;
      height: 20px;
      min-width: 20px;
      accent-color: var(--primary);
    }

    .opt-label.disabled {
      cursor: not-allowed;
      opacity: 0.88;
    }

    .opt-label.selected-correct {
      border-color: var(--correct-border) !important;
      background: var(--correct-bg) !important;
      font-weight: 700;
      color: var(--correct-text) !important;
    }

    .opt-label.selected-wrong {
      border-color: var(--wrong-border) !important;
      background: var(--wrong-bg) !important;
      font-weight: 700;
      color: var(--wrong-text) !important;
    }

    /* Floating Feedback Reactions */
    #reaction-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #reaction-overlay.show-kiss {
      transform: translate(-50%, -50%) scale(1);
      animation: kissEffect 1.2s forwards;
    }

    #reaction-overlay.show-angry {
      transform: translate(-50%, -50%) scale(1);
      animation: angryEffect 1.2s forwards;
    }

    .reaction-emoji {
      font-size: 5.5rem;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.25));
    }

    .reaction-text {
      font-size: 1.2rem;
      font-weight: 800;
      margin-top: 8px;
      padding: 6px 18px;
      border-radius: 9999px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }

    .kiss-text {
      background: #fdf2f8;
      color: #db2777;
    }

    .angry-text {
      background: #fef2f2;
      color: #dc2626;
    }

    @keyframes kissEffect {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(-15deg); opacity: 0; }
      35% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -70%) scale(0.8); opacity: 0; }
    }

    @keyframes angryEffect {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.2) rotate(-14deg); opacity: 1; }
      35% { transform: translate(-50%, -50%) scale(1.1) rotate(14deg); }
      50% { transform: translate(-50%, -50%) scale(1.1) rotate(-10deg); }
      65% { transform: translate(-50%, -50%) scale(1.1) rotate(10deg); }
      80% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -20%) scale(0.7); opacity: 0; }
    }

    /* Warning Toast for Refresh Attempts */
    #warning-toast {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: #0f172a;
      color: #fff;
      padding: 14px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 10000;
      border-left: 6px solid #f59e0b;
      font-size: 1rem;
      font-weight: 700;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    #warning-toast.show {
      display: flex;
      animation: toastBounce 0.35s ease-out;
    }

    @keyframes toastBounce {
      0% { transform: translate(-50%, 40px); opacity: 0; }
      100% { transform: translate(-50%, 0); opacity: 1; }
    }

    /* Footer & Submit */
    .submit-section {
      text-align: center;
      margin: 30px 0 15px;
    }

    .btn-submit {
      width: 100%;
      max-width: 340px;
      background: var(--primary);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 15px 28px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.97);
    }

    #final-report {
      display: none;
      background: var(--card-bg);
      border: 2px solid var(--primary);
      border-radius: 14px;
      padding: 24px;
      margin-top: 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .score-big {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--primary);
      margin: 8px 0;
    }

    /* Gradient Credit Signature */
    .credit-container {
      text-align: center;
      margin-top: 35px;
      padding: 10px 0;
    }

    .gradient-credit {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
    }

    .gradient-heart {
      background: linear-gradient(135deg, #f43f5e, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      font-style: normal;
      font-size: 1.15rem;
      animation: heartbeat 1.6s infinite ease-in-out;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="title-group">
      <h1>CSS MPT Assessment</h1>
      <p>150 Mixed MCQs &bull; Permanent Selection</p>
    </div>
    <div class="header-actions">
      <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
      <div class="stats-badge">
        <span id="answered-count">0</span> / 150
      </div>
    </div>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-bar"></div>
  </div>
</header>

<div class="container" id="quiz-root"></div>

<div class="container submit-section">
  <button class="btn-submit" onclick="showResults()">Submit Test & View Results</button>
  
  <div id="final-report">
    <h2>Evaluation Complete! 🎉</h2>
    <div class="score-big" id="score-display">0 / 150</div>
    <p id="feedback-msg" style="font-size: 1.05rem; color: var(--text-muted); margin-top: 8px;"></p>
  </div>

  <div class="credit-container">
    <div class="gradient-credit">
      Designed by BAEZY with <span class="gradient-heart">❤️</span>
    </div>
  </div>
</div>

<div id="reaction-overlay">
  <div class="reaction-emoji" id="reaction-emoji">😘</div>
  <div class="reaction-text" id="reaction-text">Correct!</div>
</div>

<div id="warning-toast">
  <span>⚠️</span> Don't do this Baby Girl
</div>

<script>
// 150 questions scrambled & interleaved across all subjects

const STORAGE_KEY = "css_mpt_mixed_150_v2";
const THEME_KEY = "css_mpt_theme_choice";

let savedAnswers = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

// Theme Management
function initTheme() {
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) {
    applyTheme(savedTheme);
  } else {
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(prefersDark ? "dark" : "light");
  }
}

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = document.getElementById("theme-btn");
  if (btn) {
    btn.textContent = theme === "dark" ? "☀️" : "🌙";
  }
  localStorage.setItem(THEME_KEY, theme);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme");
  applyTheme(current === "dark" ? "light" : "dark");
}

function renderQuiz() {
  const root = document.getElementById("quiz-root");
  root.innerHTML = "";

  quizData.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "card";
    card.id = `q-card-${index}`;

    const isAnswered = savedAnswers.hasOwnProperty(index);
    if (isAnswered) {
      const userSelected = savedAnswers[index];
      if (userSelected === item.ans) {
        card.classList.add("answered-correct");
      } else {
        card.classList.add("answered-wrong");
      }
    }

    const title = document.createElement("div");
    title.className = "q-title";
    title.innerHTML = `<span class="q-num">Q${index + 1}.</span> ${item.q}`;
    card.appendChild(title);

    const optsGrid = document.createElement("div");
    optsGrid.className = "options-grid";

    const optLetters = ["(A)", "(B)", "(C)", "(D)"];

    item.opts.forEach((optText, optIdx) => {
      const label = document.createElement("label");
      label.className = "opt-label";
      if (isAnswered) label.classList.add("disabled");

      const input = document.createElement("input");
      input.type = "radio";
      input.name = `question_${index}`;
      input.value = optIdx;
      input.disabled = isAnswered;

      if (isAnswered && savedAnswers[index] === optIdx) {
        input.checked = true;
        if (optIdx === item.ans) {
          label.classList.add("selected-correct");
        } else {
          label.classList.add("selected-wrong");
        }
      }

      input.onchange = () => handleChoice(index, optIdx);

      label.appendChild(input);
      label.appendChild(document.createTextNode(`${optLetters[optIdx]} ${optText}`));
      optsGrid.appendChild(label);
    });

    card.appendChild(optsGrid);
    root.appendChild(card);
  });

  updateStats();
}

function handleChoice(qIdx, selectedOptIdx) {
  if (savedAnswers.hasOwnProperty(qIdx)) return;

  savedAnswers[qIdx] = selectedOptIdx;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(savedAnswers));

  const isCorrect = (selectedOptIdx === quizData[qIdx].ans);
  triggerReaction(isCorrect);
  renderQuiz();
}

function triggerReaction(isCorrect) {
  const overlay = document.getElementById("reaction-overlay");
  const emoji = document.getElementById("reaction-emoji");
  const text = document.getElementById("reaction-text");

  overlay.className = "";

  if (isCorrect) {
    emoji.textContent = "😘";
    text.textContent = "Good Job! 💋";
    text.className = "reaction-text kiss-text";
    overlay.classList.add("show-kiss");
  } else {
    emoji.textContent = "😡";
    text.textContent = "Oops! Wrong Answer!";
    text.className = "reaction-text angry-text";
    overlay.classList.add("show-angry");
  }

  setTimeout(() => {
    overlay.className = "";
  }, 1300);
}

function updateStats() {
  const answeredCount = Object.keys(savedAnswers).length;
  document.getElementById("answered-count").textContent = answeredCount;
  const pct = (answeredCount / quizData.length) * 100;
  document.getElementById("progress-bar").style.width = `${pct}%`;
}

function showResults() {
  let score = 0;
  quizData.forEach((item, idx) => {
    if (savedAnswers[idx] === item.ans) {
      score++;
    }
  });

  const report = document.getElementById("final-report");
  const scoreDisplay = document.getElementById("score-display");
  const feedback = document.getElementById("feedback-msg");

  report.style.display = "block";
  scoreDisplay.textContent = `${score} / ${quizData.length}`;
  
  const percentage = ((score / quizData.length) * 100).toFixed(1);
  if (score >= 66) {
    feedback.textContent = `Scored: ${percentage}%. You qualified the test threshold easily! ✨`;
  } else {
    feedback.textContent = `Scored: ${percentage}%. Needs a bit more practice, keep going! 💪`;
  }

  report.scrollIntoView({ behavior: 'smooth' });
}

// Refresh & Leave Warning Handler
function showRefreshWarning() {
  const toast = document.getElementById("warning-toast");
  toast.classList.add("show");
  setTimeout(() => {
    toast.classList.remove("show");
  }, 3500);
}

// Intercept browser reload / tab close
window.addEventListener("beforeunload", (e) => {
  e.preventDefault();
  e.returnValue = "Don't do this Baby Girl";
  return "Don't do this Baby Girl";
});

// Intercept reload shortcuts on keyboards (F5, Ctrl+R, Cmd+R)
window.addEventListener("keydown", (e) => {
  if (
    (e.which || e.keyCode) === 116 || 
    ((e.ctrlKey || e.metaKey) && (e.which || e.keyCode) === 82)
  ) {
    e.preventDefault();
    showRefreshWarning();
  }
});

// Initialize
initTheme();
renderQuiz();
</script>
